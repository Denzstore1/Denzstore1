<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141014"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="14" fill="url(#bg)" stroke="#FFB300" stroke-width="1.5" opacity="0.98"/>

  <!-- corner brackets -->
  <path d="M20,40 L20,20 L40,20" stroke="#FFB300" stroke-width="2" fill="none"/>
  <path d="M880,40 L880,20 L860,20" stroke="#FFB300" stroke-width="2" fill="none"/>
  <path d="M20,580 L20,600 L40,600" stroke="#FFB300" stroke-width="2" fill="none"/>
