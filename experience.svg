<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141014"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)" stroke="#FF3B3B" stroke-width="1.2" opacity="0.95">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <path d="M20,38 L20,20 L38,20" stroke="#FF3B3B" stroke-width="2" fill="none"/>
  <path d="M880,38 L880,20 L862,20" stroke="#FF3B3B" stroke-width="2" fill="none"/>
  <path d="M20,182 L20,200 L38,200" stroke="#FF3B3B" stroke-width="2" fill="none"/>
  <path d="M880,182 L880,200 L862,200" stroke="#FF3B3B" stroke-width="2" fill="none"/>

  <text x="450" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#FF3B3B" filter="url(#glow)">DEVELOPMENT EXPERIENCE</text>
  <line x1="60" y1="72" x2="840" y2="72" stroke="#333" stroke-width="1"/>

  <g font-family="Consolas, monospace" font-size="13" fill="#eee">
    <rect x="55" y="95" width="140" height="30" rx="15" fill="none" stroke="#FFB300" stroke-width="1"/>
    <text x="125" y="115" text-anchor="middle" fill="#FFB300">Web Development</text>

    <rect x="205" y="95" width="160" height="30" rx="15" fill="none" stroke="#00BFFF" stroke-width="1"/>
    <text x="285" y="115" text-anchor="middle" fill="#00BFFF">Backend Development</text>

    <rect x="375" y="95" width="120" height="30" rx="15" fill="none" stroke="#00FFF7" stroke-width="1"/>
    <text x="435" y="115" text-anchor="middle" fill="#00FFF7">Digital Store</text>

    <rect x="505" y="95" width="140" height="30" rx="15" fill="none" stroke="#FF3B3B" stroke-width="1"/>
    <text x="575" y="115" text-anchor="middle" fill="#FF3B3B">WhatsApp Bot</text>

    <rect x="655" y="95" width="135" height="30" rx="15" fill="none" stroke="#FF3B3B" stroke-width="1"/>
    <text x="722" y="115" text-anchor="middle" fill="#FF3B3B">Telegram Bot</text>

    <rect x="55" y="140" width="150" height="30" rx="15" fill="none" stroke="#FF8C00" stroke-width="1"/>
    <text x="130" y="160" text-anchor="middle" fill="#FF8C00">API Development</text>

    <rect x="215" y="140" width="175" height="30" rx="15" fill="none" stroke="#FFB300" stroke-width="1"/>
    <text x="302" y="160" text-anchor="middle" fill="#FFB300">Database Management</text>

    <rect x="400" y="140" width="95" height="30" rx="15" fill="none" stroke="#00FFF7" stroke-width="1"/>
    <text x="447" y="160" text-anchor="middle" fill="#00FFF7">UI/UX</text>

    <rect x="505" y="140" width="120" height="30" rx="15" fill="none" stroke="#00BFFF" stroke-width="1"/>
    <text x="565" y="160" text-anchor="middle" fill="#00BFFF">Automation</text>
  </g>
</svg>
