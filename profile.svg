<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#101414"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bg)" stroke="#00FFF7" stroke-width="1.2" opacity="0.95">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <path d="M20,38 L20,20 L38,20" stroke="#00FFF7" stroke-width="2" fill="none"/>
  <path d="M880,38 L880,20 L862,20" stroke="#00FFF7" stroke-width="2" fill="none"/>
  <path d="M20,192 L20,210 L38,210" stroke="#00FFF7" stroke-width="2" fill="none"/>
  <path d="M880,192 L880,210 L862,210" stroke="#00FFF7" stroke-width="2" fill="none"/>

  <!-- avatar circle placeholder -->
  <circle cx="110" cy="115" r="55" fill="#1a1a1a" stroke="#FFB300" stroke-width="2"/>
  <text x="110" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#FFB300">DT</text>

  <text x="200" y="95" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#FFFFFF" filter="url(#glow)">DENZ TEMPEST</text>
  <text x="200" y="120" font-family="Consolas, monospace" font-size="14" fill="#00FFF7">Developer</text>
  <text x="200" y="145" font-family="Consolas, monospace" font-size="13" fill="#888">📍 Indonesia</text>

  <line x1="450" y1="60" x2="450" y2="170" stroke="#333" stroke-width="1"/>

  <text x="500" y="90" font-family="Consolas, monospace" font-size="12" fill="#666">[ system.status ]</text>
  <text x="670" y="90" font-family="Consolas, monospace" font-size="12" fill="#00FF88">
    ONLINE
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="118" font-family="Consolas, monospace" font-size="12" fill="#666">[ mode ]</text>
  <text x="670" y="118" font-family="Consolas, monospace" font-size="12" fill="#FFB300">BUILDING</text>

  <text x="500" y="146" font-family="Consolas, monospace" font-size="12" fill="#666">[ uptime ]</text>
  <text x="670" y="146" font-family="Consolas, monospace" font-size="12" fill="#00FFF7">∞</text>
</svg>
